<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Chalkbox icon</title>
  <desc id="desc">A ruler, set square, calculator and whiteboard marker arranged in a pile.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#071512" flood-opacity=".28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- ruler -->
    <g transform="rotate(-31 128 128)">
      <rect x="24" y="101" width="208" height="42" rx="10" fill="#d9b85f" stroke="#8c6a25" stroke-width="5"/>
      <path d="M50 103v16M68 103v10M86 103v16M104 103v10M122 103v16M140 103v10M158 103v16M176 103v10M194 103v16M212 103v10" stroke="#6f521b" stroke-width="4"/>
    </g>

    <!-- set square -->
    <g transform="rotate(17 94 139)">
      <path d="M34 72 34 206 168 206Z" fill="#d8eee6" stroke="#6f9d91" stroke-width="6"/>
      <path d="M61 137v42h42Z" fill="#17332e" stroke="#6f9d91" stroke-width="5"/>
      <path d="M34 92h14M34 112h9M34 132h14M34 152h9M34 172h14" stroke="#6f9d91" stroke-width="4"/>
    </g>

    <!-- calculator -->
    <g transform="rotate(8 166 125)">
      <rect x="120" y="55" width="91" height="129" rx="16" fill="#f3ede1" stroke="#9c8d76" stroke-width="6"/>
      <rect x="134" y="70" width="63" height="29" rx="6" fill="#233b36" stroke="#586c67" stroke-width="4"/>
      <g fill="#6e7f7a">
        <rect x="135" y="111" width="16" height="16" rx="4"/>
        <rect x="157" y="111" width="16" height="16" rx="4"/>
        <rect x="179" y="111" width="16" height="16" rx="4"/>
        <rect x="135" y="133" width="16" height="16" rx="4"/>
        <rect x="157" y="133" width="16" height="16" rx="4"/>
        <rect x="179" y="133" width="16" height="16" rx="4"/>
        <rect x="135" y="155" width="38" height="16" rx="4"/>
      </g>
      <rect x="179" y="155" width="16" height="16" rx="4" fill="#c9654d"/>
    </g>

    <!-- whiteboard marker -->
    <g transform="rotate(-11 131 191)">
      <rect x="56" y="181" width="154" height="28" rx="14" fill="#f8f7f0" stroke="#767d7a" stroke-width="5"/>
      <path d="M56 195c0-8 6-14 14-14h25v28H70c-8 0-14-6-14-14Z" fill="#315f78" stroke="#25485b" stroke-width="4"/>
      <path d="M200 181h15c8 0 14 6 14 14s-6 14-14 14h-15Z" fill="#2e3a37" stroke="#202a28" stroke-width="4"/>
      <path d="M106 190h54" stroke="#b8bdb8" stroke-width="4"/>
    </g>
  </g>
</svg>
