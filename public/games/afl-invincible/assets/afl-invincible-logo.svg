<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">AFL Invincible logo</title>
  <desc id="desc">Stylised AFL goal posts with a red football in front.</desc>
  <defs>
